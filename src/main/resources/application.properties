# --- Datasource (matches your container) ---
spring.datasource.url=jdbc:mysql://localhost:3306/smart_review?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.username=smart_review
spring.datasource.password=smart_review_pw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hikari (optional dev tuning) ---
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT (must be present & valid) ---
security.jwt.base64-secret=REPLACE_WITH_A_BASE64_STRING_>=_44_CHARS
security.jwt.expiration-ms=3600000
